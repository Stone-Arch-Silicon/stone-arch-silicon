# Builds the home-page hero film from the real photos and footage listed in
# scripts/hero_shots.json, then commits the new assets/hero-* files.
#
# It runs by itself when the shot list, the renderer, or this file changes on
# any branch except main, and commits the film back to that branch, so a pull
# request shows the new film before anyone merges it. To rebuild by hand:
# Actions -> "Build hero video" -> Run workflow, and name the branch to commit to.
name: Build hero video

on:
  push:
    branches-ignore: [main]
    paths:
      - scripts/hero_shots.json
      - scripts/make_hero.py
      - .github/workflows/hero-video.yml
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to commit to (hero-preview to check first, main to publish)"
        required: true
        default: hero-preview

permissions:
  contents: write

concurrency:
  group: hero-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg, numpy, OpenCV
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg > /dev/null
          python -m pip install --quiet numpy opencv-python-headless
          ffmpeg -version | head -1

      - name: Render
        run: python scripts/make_hero.py scripts/hero_shots.json

      - name: Commit
        env:
          BRANCH: ${{ inputs.branch || github.ref_name }}
          SOURCE: ${{ github.ref_name }}
        run: |
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then echo "Bad branch name"; exit 1; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add assets/hero-1080.mp4 assets/hero-720.webm assets/hero-mobile.mp4 \
                  assets/hero-poster.jpg assets/hero-poster-mobile.jpg assets/hero-credits.txt
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Render hero film from scripts/hero_shots.json"
          if [ "$BRANCH" = "$SOURCE" ]; then
            git pull --rebase origin "$BRANCH"      # take in anything pushed while this rendered
            git push origin "HEAD:$BRANCH"          # same branch: never overwrite anyone's commits
          else
            git push --force origin "HEAD:$BRANCH"  # a separate preview branch is rebuilt from scratch
          fi
